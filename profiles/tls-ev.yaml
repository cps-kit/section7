extends:
  - _tls.yaml
  - _subject-organization.yaml
  - _subject-ev.yaml

profile:
  name: TLS EV Certificate
  recognized_by:
    policy_oid: 2.23.140.1.1
  version: 3

requirements:
  subject:
    attributes:
      domain_component:
        required: false
        length:
          min: 1
          max: 64
      organization_identifier:
        required: false
        length:
          min: 1
          max: 64

  extensions:
    certificate_policies:
      required_values:
        - 2.23.140.1.1
      optional_values:
        - 0.4.0.194112.1.4
        - 0.4.0.19495.3.1

    qc_statements:
      required: false
      critical: false

    cabf_organization_identifier:
      required: false
      critical: false

